[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bn-tax-rag"
version = "0.1.0"
description = "Retrieval-augmented generation for Bangladeshi tax law"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "FlagEmbedding>=1.3",
    "qdrant-client>=1.12",
    "anthropic>=0.39",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools]
py-modules = ["config"]
